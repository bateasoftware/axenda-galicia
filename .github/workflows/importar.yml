# Importación diaria de las fuentes automáticas (data/fuentes.json) a la base de datos (Turso o Supabase) como PENDIENTES.
# Se activa creando la variable IMPORTAR_ACTIVO=true y los secretos (ver docs/pendientes-juan.md, bloque 5).
name: Importar eventos

on:
  schedule:
    - cron: "30 5 * * *" # 6:30 en invierno, 7:30 en verano (hora de Galicia)
  workflow_dispatch:

jobs:
  importar:
    if: ${{ vars.IMPORTAR_ACTIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Importar
        run: npm run importar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
