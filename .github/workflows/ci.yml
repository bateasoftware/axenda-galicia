# Comprueba cada push y cada pull request antes de que Vercel lo publique.
# Con git como CMS, es la red de seguridad para los JSON de data/eventos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar datos
        run: npm run validar
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
